{{define "content"}}
{{$d := .Data}}
<h1>Events</h1>
<form class="filters" method="get" action="/events">
  <select name="type" aria-label="Event type" data-autosubmit>
    <option value="">All types</option>
    {{range $d.Types}}<option {{if eq . $d.Type}}selected{{end}}>{{.}}</option>{{end}}
  </select>
  <noscript><button>Filter</button></noscript>
  <a class="button secondary" href="/events.csv{{if $d.Type}}?type={{query $d.Type}}{{end}}">Export CSV</a>
</form>
<section class="card">
<div class="table-wrap">
<table>
  <thead><tr><th>Time</th><th>Type</th><th>Details</th></tr></thead>
  <tbody>
  {{range $d.Events}}
  <tr><td><time title="{{isodate .TS}}">{{datetime .TS}}</time></td><td><strong>{{.Type}}</strong></td><td class="sub">{{summary .Payload}}</td></tr>
  {{else}}<tr><td colspan="3" class="empty">No events.</td></tr>{{end}}
  </tbody>
</table>
</div>
{{if $d.Next}}<a class="button secondary" href="/events?before={{$d.Next}}{{if $d.Type}}&amp;type={{query $d.Type}}{{end}}">Older</a>{{end}}
</section>
{{end}}
